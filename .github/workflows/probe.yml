# 러너에서 외부 소스가 열리는지 한 번 재보는 일회성 조사.
# PC 예약작업을 GitHub Actions 로 옮기기 전에, 데이터센터 IP 에서도 유튜브 검색이
# 되는지 확인하는 것이 목적이다. 확인이 끝나면 이 파일은 지운다.
name: probe

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/probe.py'
      - '.github/workflows/probe.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 외부 소스 조사
        run: python .github/probe.py

      - name: 결과를 요약에 붙이기
        if: always()
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat _probe_result.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: 결과 커밋
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f _probe_result.txt
          git commit -m "chore(probe): 러너 외부 소스 조사 결과" || exit 0
          git push
